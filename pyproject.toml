[project]
name = "ascon-plus"
version = "0.1.0"
description = "Scalable Multi-Node ASCON-Secured IoT Communication"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "ascon",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
bench = [
    "simpy",
    "pandas",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
