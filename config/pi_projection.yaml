# Configuration for Raspberry Pi Zero W Benchmark Hardware & Scenarios
# Target Hardware: Raspberry Pi Zero W (BCM2835, Single-Core ARMv6 @ 1 GHz, 512 MB RAM)

hardware:
  target: "Raspberry Pi Zero W"
  soc: "Broadcom BCM2835"
  architecture: "ARMv6 (32-bit)"
  core_count: 1
  clock_mhz: 1000
  memory_mb: 512

slowdown_factors:
  # Sensitivity and variance scenarios for pure-Python ASCON encrypt/decrypt
  pure_python_ascon:
    low: 15
    mid: 30
    high: 60

  # Sensitivity and variance scenarios for X25519 & HKDF-SHA256
  openssl_crypto:
    low: 10
    mid: 25
    high: 50

  # Sensitivity scenarios for protocol framing and TCP socket handling
  framing_socket:
    low: 10
    mid: 20
    high: 40

memory:
  # Measured memory methodology on Raspberry Pi Zero W
  scale_rss: false
  notes: "Direct Resident Set Size (RSS) delta and High Water Mark (HWM) measurements on Raspberry Pi Zero W."

default_band: "mid"
